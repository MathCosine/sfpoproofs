<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cowconuts 2026 — Guts Round</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Not render-blocking: on a network that silently drops Google, a blocking
     stylesheet would hold the whole page blank until the request gave up. -->
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥥</text></svg>">
<style>
/* =====================================================================
   Cowconuts guts board.

   Light, quiet, and built to be read from the back of a room. The work
   is done by type weight, alignment and a single hairline — not by
   borders and drop shadows on every element. Placings are marked with a
   thin metal rule and a coloured numeral rather than a filled block, so
   first place reads as first without the row shouting.

   Single-theme on purpose: a hall's lighting is not the viewer's OS
   setting, so every colour is stated outright.
   ===================================================================== */
:root{
  --paper:#fbfaf7;
  --card:#ffffff;
  --ink:#16181d;
  --ink-soft:#4d525c;
  --ink-faint:#8b909b;
  --rule:#e7e4dc;
  --rule-soft:#f0ede6;
  --accent:#1f6f5c;          /* one accent, used sparingly */
  --gold:#b08423;
  --silver:#7c828c;
  --bronze:#a26a41;
  --live:#1f9d5b;
  --stop:#b3402f;
  --sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; font-feature-settings:"tnum" 1;
}
.wrap{height:100%;display:flex;flex-direction:column;padding:26px 30px 18px;gap:20px}

/* ---------- masthead ---------- */
header{display:flex;align-items:flex-end;gap:24px;flex:none;
  padding-bottom:16px;border-bottom:1px solid var(--rule)}
.brand{display:flex;flex-direction:column;gap:3px}
.brand__contest{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-faint)}
.brand__round{font-size:clamp(24px,2.6vw,38px);font-weight:700;letter-spacing:-.025em;line-height:1}

.state{margin-left:auto;display:flex;align-items:flex-end;gap:26px}
.stat{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.stat__label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-faint)}
.stat__value{font-family:var(--mono);font-size:clamp(15px,1.5vw,20px);font-weight:500;line-height:1}
.clock .stat__value{font-size:clamp(34px,4.4vw,56px);font-weight:500;letter-spacing:-.02em;
  line-height:.9}
.clock--stopped .stat__value{color:var(--ink-faint)}
.clock--out .stat__value{color:var(--stop)}
.frozen{
  align-self:center;padding:5px 12px;border:1px solid var(--gold);border-radius:4px;
  color:var(--gold);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
}

/* ---------- columns ---------- */
.cols{flex:1;display:grid;grid-template-columns:1.5fr 1fr;gap:34px;min-height:0}
@media (max-width:980px){.cols:not(.cols--split){grid-template-columns:1fr}.rest{display:none}}
.colhead{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;
  font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.colhead .count{margin-left:auto;font-family:var(--mono);font-weight:400}

/* ---------- leader cards ---------- */
.lead{display:flex;flex-direction:column;min-height:0}
.leadlist{display:flex;flex-direction:column;gap:7px;flex:1;min-height:0}
.card{
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto auto;
  align-items:center;
  gap:18px;
  background:var(--card);
  border:1px solid var(--rule);
  border-left:3px solid transparent;
  border-radius:6px;
  padding:0 18px;
  flex:1;min-height:0;
}
.card--1{border-left-color:var(--gold)}
.card--2{border-left-color:var(--silver)}
.card--3{border-left-color:var(--bronze)}
.place{font-family:var(--mono);font-size:clamp(17px,1.9vw,26px);font-weight:400;
  color:var(--ink-faint);min-width:1.4em;text-align:right}
.card--1 .place{color:var(--gold);font-weight:500}
.card--2 .place{color:var(--silver);font-weight:500}
.card--3 .place{color:var(--bronze);font-weight:500}

.who{min-width:0;display:flex;flex-direction:column;gap:2px}
.name{font-size:clamp(15px,1.7vw,23px);font-weight:600;letter-spacing:-.015em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:flex;align-items:center;gap:8px;font-size:clamp(10px,.95vw,13px);color:var(--ink-faint)}
.sub .num{font-family:var(--mono)}
.div{font-weight:600;letter-spacing:.06em;color:var(--ink-soft)}

/* seven segments, one per guts set */
.sets{display:flex;align-items:center;gap:8px}
.segs{display:flex;gap:3px}
.seg{width:9px;height:16px;border-radius:1.5px;background:var(--rule)}
.seg--done{background:var(--accent)}
.seg--now{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent)}
.onset{font-family:var(--mono);font-size:clamp(10px,.95vw,12px);color:var(--ink-soft);
  white-space:nowrap;min-width:3.2em}

.score{font-family:var(--mono);font-size:clamp(21px,2.5vw,34px);font-weight:500;
  letter-spacing:-.02em;text-align:right;min-width:2.2em}

/* ---------- the rest ---------- */
.rest{display:flex;flex-direction:column;min-height:0}
.restview{flex:1;min-height:0;overflow:hidden;position:relative;
  border-top:1px solid var(--rule)}
.resttrack{position:absolute;inset:0}
.rrow{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto auto;
  align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--rule-soft);
  font-size:clamp(12px,1.15vw,15px)}
.rrow .place{font-size:1em;min-width:0}
.rrow .name{font-size:1em;font-weight:500}
.rrow .onset{font-size:.85em;color:var(--ink-faint);min-width:0}
.rrow .score{font-size:1.05em;font-weight:500;min-width:0}

.empty{display:grid;place-items:center;height:100%;color:var(--ink-faint);
  font-size:14px;padding:30px;text-align:center}

footer{flex:none;display:flex;align-items:center;gap:9px;padding-top:12px;
  border-top:1px solid var(--rule);
  font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--live)}
.pulse--down{background:var(--stop)}
footer .spacer{margin-left:auto}
/* Says outright that this page is showing someone else's project, so a
   doctored link cannot pass its numbers off as the contest's. */
.offsite{margin-left:14px;padding:2px 9px;border-radius:999px;
  background:#fdf3e3;color:#8a5a12;border:1px solid #e8d5ae;
  font-size:11px;font-weight:600;letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){.resttrack{transition:none!important}}

/* ---------- both divisions at once ----------
   The two divisions sit different guts papers, so they are ranked apart
   and shown side by side: a column each, its leaders as cards and the
   rest creeping upward beneath them. */
.cols--split{grid-template-columns:1fr 1fr;gap:30px}
.divcol{display:flex;flex-direction:column;min-height:0}
.divcol .colhead{font-size:13px;color:var(--ink-soft)}
.divcol .colhead .divname{font-size:clamp(15px,1.5vw,20px);font-weight:700;letter-spacing:.08em;
  color:var(--ink)}
.divcol .leadlist{flex:none}
.divcol .card{flex:none;height:clamp(46px,7.4vh,78px);gap:14px;padding:0 14px}
.divcol .restview{margin-top:10px}
.divcol .empty{height:auto}
/* On a phone there is no room for two columns or for either to scroll
   inside itself, so the page scrolls instead: A, then B, every team. */
@media (max-width:980px){
  html.split,html.split body{height:auto;overflow:auto}
  html.split .wrap{height:auto}
  .cols--split{grid-template-columns:1fr;gap:26px}
  .cols--split .sets{display:none}
  .cols--split .restview{overflow:visible}
  .cols--split .resttrack{position:static;transform:none!important}
}
</style>
</head>
<body data-app-version="2026.09.25.1">
<div class="wrap">
  <header>
    <div class="brand">
      <span class="brand__contest" id="contestName">Cowconuts 2026</span>
      <h1 class="brand__round">Guts Round</h1>
    </div>
    <div class="state">
      <div class="frozen" id="frozenFlag" hidden>Frozen</div>
      <div class="stat"><span class="stat__label">Teams</span>
        <span class="stat__value" id="teamCount">—</span></div>
      <div class="stat" id="leadStat"><span class="stat__label">Leader</span>
        <span class="stat__value" id="leadScore">—</span></div>
      <div class="stat clock" id="clock"><span class="stat__label">Time left</span>
        <span class="stat__value" id="clockTime">--:--</span></div>
    </div>
  </header>

  <main class="cols" id="cols">
    <div class="empty">Waiting for the first set to be scored.</div>
  </main>

  <footer>
    <span class="pulse" id="pulse"></span><span id="liveLabel">Live</span>
    <span class="offsite" id="offsite" hidden>Pointed at another project by this link</span>
    <span class="spacer"></span>
    <span id="updated"></span>
  </footer>
</div>

<script type="module">
import { resolvedConfig } from './assets/config.js?v=2026.09.25.1';
import { createPublicStore } from './assets/store.js?v=2026.09.25.1';
import { gutsRemaining, formatClock, competitionRanks } from './assets/scoring.js?v=2026.09.25.1';

// The board has no password to give away, so it may still be pointed at a
// project from the address bar — that is how a projector machine is set
// up without touching its storage. It says so on screen when that
// happens, so a doctored link cannot pass itself off as the contest.
const cfg = resolvedConfig(location.search, { allowUrlParams: true });
if (cfg.FROM_ADDRESS_BAR) document.querySelector('#offsite').hidden = false;
const $ = (s) => document.querySelector(s);
const SETS = cfg.GUTS_SETS;

let board = [];
let state = null;

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

/** Completed sets from the bitmask, and the one a team is working on. */
function progress(mask) {
  const done = [];
  for (let i = 0; i < SETS; i += 1) if (mask & (1 << i)) done.push(i + 1);
  const next = done.length >= SETS ? null : (() => {
    for (let i = 0; i < SETS; i += 1) if (!(mask & (1 << i))) return i + 1;
    return null;
  })();
  return { done, count: done.length, next };
}

function segments(mask) {
  const { next } = progress(mask);
  const wrap = el('div', 'segs');
  for (let i = 1; i <= SETS; i += 1) {
    let cls = 'seg';
    if (mask & (1 << (i - 1))) cls += ' seg--done';
    else if (i === next) cls += ' seg--now';
    wrap.appendChild(el('span', cls));
  }
  return wrap;
}

function setLabel(mask) {
  const { count, next } = progress(mask);
  if (next === null) return 'All 7 in';
  if (count === 0) return 'Set 1';
  return `Set ${next}`;
}

// Both divisions sit their own guts paper, so they are ranked apart. The
// board shows them side by side; ?division=A (or B) gives one division the
// whole screen, for a room that has a projector each.
const DIVISIONS = ['A', 'B'];
const ONLY = (() => {
  const params = new URLSearchParams(location.search);
  const d = String(params.get('division') ?? params.get('div') ?? '').trim().toUpperCase();
  return DIVISIONS.includes(d) ? d : null;
})();
if (ONLY) {
  document.querySelector('.brand__round').textContent = `Guts Round · Division ${ONLY}`;
  document.title = `${document.title} · Division ${ONLY}`;
}

/** The division a board row belongs to; its team ID carries it too. */
function divisionOf(row) {
  const d = String(row.division || String(row.team ?? '').charAt(0)).toUpperCase();
  return DIVISIONS.includes(d) ? d : null;
}

/**
 * One division's standings, best first, with competition places: two
 * teams on the same score are both in that place, and the place after
 * them is the one their position gives it. A projector counting 1, 2, 3
 * down the rows would show a shared lead as a lead and a second, in
 * front of the room it is wrong in front of.
 *
 * A team still on 0 has no place. With the whole team list on the board
 * from the start, every team is on 0 before the first set is marked, and
 * forty teams all "tied for first" in gold says nothing true.
 */
function ranked(rows) {
  const sorted = [...rows].sort(
    (a, b) => Number(b.score) - Number(a.score)
      || String(a.team).localeCompare(String(b.team), undefined, { numeric: true }));
  const places = competitionRanks(sorted, (r) => Number(r.score));
  return sorted.map((row, i) => ({ row, place: Number(row.score) > 0 ? places[i] : null }));
}

function leaderCard({ row, place }, { showDivision }) {
  const card = el('div', `card${place && place <= 3 ? ` card--${place}` : ''}`);
  const who = el('div', 'who');
  who.appendChild(el('div', 'name', row.name || `Team ${row.team}`));
  const sub = el('div', 'sub');
  sub.append(el('span', 'num', `#${row.team}`));
  if (showDivision && row.division) sub.append(el('span', 'div', `Div ${row.division}`));
  sub.append(el('span', 'num', `${row.solved} correct`));
  who.appendChild(sub);

  const sets = el('div', 'sets');
  sets.append(segments(row.set_mask ?? 0), el('span', 'onset', setLabel(row.set_mask ?? 0)));

  card.append(el('div', 'place', place ? String(place) : '–'), who, sets,
    el('div', 'score', String(Number(row.score))));
  return card;
}

function restRow({ row, place }) {
  const line = el('div', 'rrow');
  line.append(
    el('div', 'place', place ? String(place) : '–'),
    el('div', 'name', row.name || `Team ${row.team}`),
    el('div', 'onset', setLabel(row.set_mask ?? 0)),
    el('div', 'score', String(Number(row.score))),
  );
  return line;
}

const topLabel = (list, n) => {
  const cut = list.slice(0, n).filter((r) => r.place);
  return cut.length ? `Top ${cut[cut.length - 1].place}` : '';
};

/** One division given the whole screen: leaders left, everyone else right. */
function renderWhole(host, list) {
  const lead = el('section', 'lead');
  const head = el('div', 'colhead');
  head.append(el('span', null, 'Leaders'), el('span', 'count', topLabel(list, 10)));
  head.lastChild.id = 'leadCount';
  const leadList = el('div', 'leadlist');
  leadList.id = 'leadList';
  if (!list.length) leadList.appendChild(el('div', 'empty', 'Waiting for the first set to be scored.'));
  list.slice(0, 10).forEach((entry) => leadList.appendChild(leaderCard(entry, { showDivision: !ONLY })));
  lead.append(head, leadList);

  const restList = list.slice(10);
  const rest = el('section', 'rest');
  const restHead = el('div', 'colhead');
  restHead.append(el('span', null, 'Standings'),
    el('span', 'count', restList.length ? `${restList.length} more` : ''));
  const view = el('div', 'restview');
  const track = el('div', 'resttrack');
  track.id = 'restTrack';
  if (!restList.length) track.appendChild(el('div', 'empty', 'Every team is in the top ten.'));
  restList.forEach((entry) => track.appendChild(restRow(entry)));
  view.appendChild(track);
  rest.append(restHead, view);
  host.append(lead, rest);
}

/** A column per division, each ranked on its own. */
const SPLIT_LEADERS = 5;
function renderSplit(host, byDivision) {
  for (const d of DIVISIONS) {
    const list = byDivision[d];
    const col = el('section', 'divcol');
    col.dataset.division = d;
    const head = el('div', 'colhead');
    head.append(el('span', 'divname', `Division ${d}`),
      el('span', 'count', list.length ? `${list.length} team${list.length === 1 ? '' : 's'}` : ''));
    const leadList = el('div', 'leadlist');
    if (!list.length) leadList.appendChild(el('div', 'empty', 'No teams yet.'));
    list.slice(0, SPLIT_LEADERS).forEach((entry) => leadList.appendChild(leaderCard(entry, {})));
    col.append(head, leadList);
    const restList = list.slice(SPLIT_LEADERS);
    if (restList.length) {
      const view = el('div', 'restview');
      const track = el('div', 'resttrack');
      restList.forEach((entry) => track.appendChild(restRow(entry)));
      view.appendChild(track);
      col.appendChild(view);
    }
    host.appendChild(col);
  }
}

function render() {
  // A disqualified team comes off the board completely — that is what the
  // portal tells whoever disqualifies it, and a projector in front of an
  // audience is no place to publish the accusation.
  const live = board.filter((r) => !r.disqualified);
  const shown = ONLY ? live.filter((r) => divisionOf(r) === ONLY) : live;

  $('#contestName').textContent = state?.contest_name ?? cfg.CONTEST_NAME;
  $('#teamCount').textContent = shown.length || '—';
  $('#frozenFlag').hidden = !state?.guts_frozen;

  const host = $('#cols');
  host.replaceChildren();
  if (ONLY) {
    const list = ranked(shown);
    host.className = 'cols';
    document.documentElement.classList.remove('split');
    $('#leadStat').hidden = false;
    $('#leadScore').textContent = list.length ? Number(list[0].row.score) : '—';
    renderWhole(host, list);
  } else {
    // Each column shows its own leader, and one "leader" across two
    // different papers would compare scores that cannot be compared.
    host.className = 'cols cols--split';
    document.documentElement.classList.add('split');
    $('#leadStat').hidden = true;
    renderSplit(host, Object.fromEntries(
      DIVISIONS.map((d) => [d, ranked(shown.filter((r) => divisionOf(r) === d))])));
  }
  startScroll();
  renderClock();
}

/**
 * The overflow lists creep upward and wrap, so a room can read every team
 * without anyone touching the machine. Each only moves when there is
 * genuinely more than fits, and each at its own pace.
 */
let scrollTimers = [];
function startScroll() {
  scrollTimers.forEach(clearInterval);
  scrollTimers = [];
  for (const view of document.querySelectorAll('.restview')) {
    const track = view.querySelector('.resttrack');
    if (!track) continue;
    track.style.transform = 'translateY(0)';
    const overflow = track.scrollHeight - view.clientHeight;
    if (overflow <= 8) continue;
    let y = -10;
    scrollTimers.push(setInterval(() => {
      y += 0.35;
      if (y > overflow + 30) y = -10;
      track.style.transform = `translateY(${-Math.max(0, y)}px)`;
    }, 40));
  }
}

function renderClock() {
  const clock = $('#clock');
  clock.className = 'stat clock';
  if (!state) {
    // Nothing loaded yet. Showing a red 00:00 before the first fetch
    // reads as "time is up" to a room that can only see the screen.
    $('#clockTime').textContent = '--:--';
    clock.classList.add('clock--stopped');
    return;
  }
  const remaining = gutsRemaining(state);
  $('#clockTime').textContent = formatClock(remaining);
  if (remaining <= 0) clock.classList.add('clock--out');
  else if (!state.guts_running) clock.classList.add('clock--stopped');
}
setInterval(renderClock, 1000);

function setLive(ok) {
  $('#pulse').className = ok ? 'pulse' : 'pulse pulse--down';
  $('#liveLabel').textContent = ok ? 'Live' : 'Reconnecting';
}

const stamp = () => {
  $('#updated').textContent = `Updated ${new Date().toLocaleTimeString([], {
    hour: '2-digit', minute: '2-digit', second: '2-digit',
  })}`;
};

// ---------------------------------------------------------------------
const demo = new URLSearchParams(location.search).has('demo');

if (demo || !cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY) {
  // Reads the same published board the portal writes, so demo mode and
  // contest day take the identical path — including the freeze, which
  // stops the portal republishing and therefore stops this moving.
  const read = () => {
    try {
      const db = JSON.parse(localStorage.getItem('contest-demo-db') ?? '{}');
      board = Array.isArray(db.gutsPublic) ? db.gutsPublic : [];
      state = db.state ?? null;
    } catch { board = []; }
    stamp();
    render();
  };
  setLive(true);
  read();
  addEventListener('storage', read);
  if ('BroadcastChannel' in window) new BroadcastChannel('contest-demo').addEventListener('message', read);
  setInterval(read, 3000);
} else {
  const store = createPublicStore(cfg);
  // One read at a time: on a slow connection a poll can outlast the next
  // one, and stacking them up would only make it slower.
  let pulling = false;
  const pull = async () => {
    if (pulling) return;
    pulling = true;
    try {
      const next = await store.load();
      board = next.board;
      state = next.state;
      setLive(true);
      stamp();
      render();
    } catch {
      setLive(false);
    } finally {
      pulling = false;
    }
  };
  await pull();
  store.onChange(pull);
}
</script>
</body>
</html>
