name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit:
    name: scoring + CSV logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  database:
    name: database (20 scorers at once)
    runs-on: ubuntu-latest
    # The browser test's twenty tabs share one Web Locks API. On contest
    # day the lock is SQL, and twenty laptops share nothing. Run the real
    # schema against a real Postgres so that half is covered too.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - run: npm run test:db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  browser:
    name: browser test (concurrent scorers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CHROMIUM_PATH: ''
