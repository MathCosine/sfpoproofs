name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit:
    name: scoring + CSV logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  browser:
    name: browser test (concurrent scorers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CHROMIUM_PATH: ''
